name: Publish Package

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      prerelease_id:
        description: 'Prerelease identifier (e.g., alpha, beta, rc)'
        required: false
        default: 'beta'
      dry_run:
        description: 'Dry run (simulate release without publishing)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
      # OIDC
      id-token: write
    env:
      # Force npm to emit provenance (SLSA) when publishing via OIDC.
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@3.6.1 --activate

      - name: Ensure npm 11.5.1+ for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      
      - name: Cache yarn dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      
      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Run tests
        run: yarn test
      
      - name: Run typecheck
        run: yarn typecheck
      
      - name: Run linter
        run: yarn lint
      
      - name: Build package
        run: yarn prepare
      
      
      - name: Determine release command
        id: release_cmd
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          PRERELEASE_ID="${{ github.event.inputs.prerelease_id }}"
          
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          else
            DRY_RUN_FLAG=""
          fi
          
          if [[ "$RELEASE_TYPE" == "pre"* ]]; then
            echo "cmd=yarn release $RELEASE_TYPE --preRelease=$PRERELEASE_ID $DRY_RUN_FLAG --no-git.commit --ci --verbose" >> $GITHUB_OUTPUT
          else
            echo "cmd=yarn release $RELEASE_TYPE $DRY_RUN_FLAG --no-git.commit --ci --verbose" >> $GITHUB_OUTPUT
          fi
      
      - name: Run release
        run: ${{ steps.release_cmd.outputs.cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-logs
          path: ~/.npm/_logs/
          retention-days: 7
